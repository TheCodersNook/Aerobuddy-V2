; AeroBuddy v5 firmware — PlatformIO build config.
; (v4 lineage: PuffPal v4 / AeroBuddy v2; see README.md.)
; Board: Seeed XIAO nRF52840. Framework: Adafruit nRF52 Arduino core.
; Display: GxEPD2 driving the GDEH0154D67 1.54" 200x200 e-ink panel.
; BLE: Bluefruit52Lib (bundled in the Adafruit core — no extra lib_deps)
; drives the OpenHaystack Find My beacon (see OPENHAYSTACK.md). No MFi,
; no Apple approval — unofficial DIY tracking, bench prototype only.
;
; NOTE on the platform: mainline platform-nordicnrf52 (v11.0.0) does
; NOT ship a Seeed XIAO nRF52840 board — there is no
; `seeed_xiao_nrf52840` board ID in it (verified Nov 23, 2026; the v3
; firmware's platformio.ini names that ID and cannot build as-is).
; This project uses Seeed's own PlatformIO platform, per the Seeed
; wiki "XIAO nRF52840-Sense with PlatformIO", which carries the
; Adafruit-core XIAO variant. The Sense and non-Sense XIAO share this
; board definition (same pinout; the Sense only adds IMU + mic).

[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@^1.6.7
build_flags =
  -D AEROBUDDY_V5
; Upload: `pio run -t upload` (nrfutil DFU; double-press reset first if
; the port doesn't appear). No .uf2 is emitted by this build — the
; manual path is firmware.hex converted with uf2conv.py, or flash from
; the Arduino IDE.
